run_name: prune_2x_s44_def
model: resnet18
seed: 44
data_root: ./data
num_workers: 8
base_checkpoint: checkpoints/baseline_resnet18_s44_def.pt
checkpoint: checkpoints/prune_2x_s44_def.pt
compression:
  method: prune
  ratio: 2.0
  sparsity: 0.5
train:
  epochs: 40
  batch_size: 128
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 5
    - 8
    k: 6
