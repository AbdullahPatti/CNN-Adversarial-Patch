run_name: gtsrb_quant_4x_int8_s44_def
model: resnet18
dataset: gtsrb
seed: 44
data_root: ./data
num_workers: 8
base_checkpoint: checkpoints/gtsrb/gtsrb_baseline_s44_def.pt
checkpoint: checkpoints/gtsrb/gtsrb_quant_4x_int8_s44_def.pt
compression:
  method: quant
  ratio: 4.0
  mode: ptq
  weight_bits: 8
  act_bits: 8
  calib_batches: 20
train:
  epochs: 100
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 5
    - 8
    k: 6
    img: 32
