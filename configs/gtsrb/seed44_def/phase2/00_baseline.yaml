run_name: gtsrb_baseline_s44_def
model: resnet18
dataset: gtsrb
seed: 44
data_root: ./data
num_workers: 8
checkpoint: checkpoints/gtsrb/gtsrb_baseline_s44_def.pt
compression:
  method: none
  ratio: 1.0
train:
  epochs: 100
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 5
    - 8
    k: 6
    img: 32
