run_name: prune_4x_s43_def
model: resnet18
seed: 43
data_root: ./data
num_workers: 8
base_checkpoint: checkpoints/baseline_resnet18_s43_def.pt
checkpoint: checkpoints/prune_4x_s43_def.pt
compression:
  method: prune
  ratio: 4.0
  sparsity: 0.75
train:
  epochs: 40
  batch_size: 128
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 5
    - 8
    k: 6
