run_name: inette_baseline_s42_def
model: resnet50
dataset: imagenette
seed: 42
data_root: ./data
num_workers: 12
checkpoint: checkpoints/inette/inette_baseline_s42_def.pt
compression:
  method: none
  ratio: 1.0
train:
  epochs: 120
  batch_size: 64
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 35
    - 56
    k: 6
    img: 224
