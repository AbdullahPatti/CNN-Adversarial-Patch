run_name: inette_prune_4x_s42_def
model: resnet50
dataset: imagenette
seed: 42
data_root: ./data
num_workers: 12
base_checkpoint: checkpoints/inette/inette_baseline_s42_def.pt
checkpoint: checkpoints/inette/inette_prune_4x_s42_def.pt
compression:
  method: prune
  ratio: 4.0
  sparsity: 0.75
train:
  epochs: 30
  batch_size: 64
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 35
    - 56
    k: 6
    img: 224
