run_name: inette_quant_4x_int8_s42
model: resnet50
dataset: imagenette
seed: 42
data_root: ./data
num_workers: 12
base_checkpoint: checkpoints/inette/inette_baseline_s42.pt
checkpoint: checkpoints/inette/inette_quant_4x_int8_s42.pt
compression:
  method: quant
  ratio: 4.0
  mode: ptq
  weight_bits: 8
  act_bits: 8
  calib_batches: 20
train:
  epochs: 120
  batch_size: 64
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  select: last
