run_name: kd_2x
model: resnet18
seed: 42
data_root: ./data
num_workers: 8
width: 45
base_checkpoint: checkpoints/baseline_resnet18.pt
checkpoint: checkpoints/kd_2x.pt
compression:
  method: distill
  ratio: 2.0
  temperature: 4.0
  alpha: 0.9
train:
  epochs: 200
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
