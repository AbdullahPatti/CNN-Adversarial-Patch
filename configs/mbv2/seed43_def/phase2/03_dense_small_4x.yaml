run_name: mbv2_dense_small_4x_s43_def
model: mobilenetv2
dataset: cifar10
seed: 43
data_root: ./data
num_workers: 8
width: 16
checkpoint: checkpoints/mbv2/mbv2_dense_small_4x_s43_def.pt
compression:
  method: none
  ratio: 4.0
  note: capacity control for RQ4, no compression applied
train:
  epochs: 120
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  select: last
  mask_aug:
    sizes:
    - 5
    - 8
    k: 6
    img: 32
