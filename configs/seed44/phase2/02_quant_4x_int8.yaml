compression:
  method: quant
  ratio: 4.0
  mode: ptq
  weight_bits: 8
  act_bits: 8
  calib_batches: 20
train:
  epochs: 15
  batch_size: 128
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  select: last
